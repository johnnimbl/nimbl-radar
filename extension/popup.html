<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimbl Radar</title>
<link rel="stylesheet" href="ui.css">
<style>body{width:300px}.wrap{padding:14px;gap:10px}</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="icons/icon48.png" alt=""><h1>Nimbl Radar</h1></div>
  <p id="state" class="help">Checking the connection…</p>
  <div class="row">
    <button class="btn btn-primary" id="open" type="button">Open Radar</button>
    <button class="btn" id="settings" type="button">Settings</button>
  </div>
  <p class="help">On LinkedIn, the Radar panel appears on profiles and in messages. Select text on any page and right-click “Add to Radar…” to save it as a note or a job posting.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
