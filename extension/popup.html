<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimbl Radar</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="home.css">
<style>
body { width: 400px; }
.wrap { padding: 12px 14px 14px; gap: 12px; }
.top { display: flex; align-items: center; gap: 8px; }
.top img { width: 26px; height: 26px; }
.top h1 { font-size: 16px; margin: 0; flex: 1; }
.btn { padding: 5px 11px; font-size: 12px; }
.icon { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--ink); min-width: 28px; min-height: 28px; border-radius: 6px; }
.icon:hover { background: var(--surface-2); }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <img src="icons/icon48.png" alt="">
    <h1 id="title">Radar home</h1>
    <span id="chip"></span>
    <button class="icon" id="reload" type="button" title="Refresh" aria-label="Refresh">↻</button>
    <button class="btn btn-primary" id="open" type="button">Open Radar</button>
    <button class="icon" id="settings" type="button" title="Settings" aria-label="Settings">⚙</button>
  </div>
  <div id="home"><p class="help">Loading your Radar numbers…</p></div>
  <p class="help" id="foot">On LinkedIn, the Radar panel shows each person's record, with Home a click away. Select text on any page and right-click “Add to Radar…” to save it as a note or a job posting.</p>
</main>
<script src="home.js"></script>
<script src="popup.js"></script>
</body>
</html>
