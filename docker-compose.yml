services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nimbl
      POSTGRES_PASSWORD: nimbl
      POSTGRES_DB: nimbl_radar
    ports:
      - "5432:5432"
    volumes:
      - nimbl_radar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nimbl:nimbl@db:5432/nimbl_radar
      PGSSL: "false"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  nimbl_radar_db:
