<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Nimbl Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#0d0129; --ink-soft:#5b5470; --paper:#fffcf7; --surface:#ffffff;
    --surface-2:#fbf1d9; --yellow:#fae59b; --teal:#19615c; --critical:#a13f3f;
    --shadow-hard: 1px 1px 3px 0px #000000;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink);
    font-family:"Inter",ui-sans-serif,system-ui,sans-serif; font-weight:500;
    padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--ink);
    border-radius:14px; box-shadow: var(--shadow-hard); padding:36px 32px 32px;
    text-align:center;
  }
  .brand-logo{width:180px; height:auto; margin-bottom:22px;}
  h1{font-size:1.3rem; font-weight:700; margin:0 0 4px;}
  .tag{color:var(--ink-soft); font-size:.85rem; margin-bottom:26px;}
  .btn-google{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:11px 16px; border:1px solid var(--ink); border-radius:8px;
    background:var(--surface); color:var(--ink); font-weight:600; font-size:.92rem;
    text-decoration:none; cursor:pointer; transition:background .15s ease;
  }
  .btn-google:hover{background:var(--surface-2);}
  .btn-google svg{flex:0 0 auto;}
  .error{
    margin-top:18px; padding:10px 12px; border:1px solid var(--critical); border-radius:8px;
    background:#fbeaea; color:var(--critical); font-size:.82rem; text-align:left;
  }
  .footnote{margin-top:22px; color:var(--ink-soft); font-size:.75rem;}
</style>
</head>
<body>
  <div class="card">
    <img class="brand-logo" src="/img/nimbl-logo.png" alt="nmbl.ai">
    <h1>Nimbl Radar</h1>
    <div class="tag">Nearshore LATAM staffing · lead CRM</div>
    <a class="btn-google" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
    <div id="error" class="error" style="display:none"></div>
    <div class="footnote">Access is limited to @<span id="domain">nimbl.ai</span> accounts.</div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var err = params.get("error");
    if (err) {
      var box = document.getElementById("error");
      box.style.display = "block";
      box.textContent = err === "domain"
        ? "That Google account isn't on the allowed domain. Sign in with your work account instead."
        : "Sign-in didn't complete. Please try again.";
    }
  </script>
</body>
</html>
